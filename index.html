<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" type="image/png" href="./src/img/Rodaja de limón pixelada circular.png">
        <link rel="stylesheet" href="./src/css/style.css">

        <script defer src="./src/scripts/config.js"></script>
        <script defer type="module" src="./src/scripts/main.js"></script>
        
        <title>Lemon Squeezer</title>
    </head>
    
    <body>
    
        <header>
    
            <nav>
                <h1>Lemon Squeezer</h1>
            </nav>
    
        </header>

        <aside class="shop">
    
            <div class="shop-head">
                <img src="./src/img/Icono tienda.png" alt="">
                <h2>Lemon Shop</h2>
            </div>
    
            <div>
                <div id="pasiveItems"></div>
            </div>
            <h2>Auto Squeezers</h2>
            <div>
                <div id="autoItems"></div>
            </div>
        </aside>

        <button id="open-upgrades" type="button"
                aria-controls="upgrades-panel" aria-expanded="false">
            ☰ Actives upgrades
        </button>

        <aside id="upgrades-panel" hidden>
            <div class="upgrades-cabecera">
                <h2>upgrades activas</h2>
                <button id="cerrar-upgrades" type="button" aria-label="Cerrar upgrades">✕</button>
            </div>
            <div class="upgrade-list">
                <section class="upgrade">
                    <h3>Exprimidor b&aacute;sico</h3>
                    <p>+1 points per click</p>
                </section>
                <section class="upgrade">
                    <h3>Limonero automático</h3>
                    <p>+5 points per second</p>
                </section>
            </div>
        </aside>

        <main>

            <div id="lemon-container">
                <img id="lemon" src="./src/img/Limón pixelado completo con hoja verde.png" alt="imagen del limón">
            </div>

        </main>

        <footer>
            <div class="score-container">
                <div class="points-board">
                    <p id="points">0</p>
                </div>

                <div class="multiplier-board">
                    <p id="multiplier">×1.00</p>
                </div>
            </div>
        </footer>
    </body>
</html>
